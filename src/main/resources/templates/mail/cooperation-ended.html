<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:24px;background:#f2f4f5;
             font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
             color:#16232b;line-height:1.6">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:520px;background:#ffffff;border:1px solid #cfd8dc;
                    border-radius:4px;padding:32px">
                <tr>
                    <td>
                        <h1 style="margin:0 0 16px;font-size:22px;font-weight:600">
                            Koniec współpracy
                        </h1>
                        <p style="margin:0 0 16px">
                            <strong th:text="${initiatorName}">—</strong> zakończył(a) Waszą
                            współpracę trenerską.
                        </p>
                        <p style="margin:0 0 16px;font-size:14px;color:#5b6b75">
                            Wszystkie Twoje dane zostają na miejscu — plany, dziennik, cele
                            i statystyki są nietknięte. Zmienia się tylko to, że druga strona
                            nie ma już do nich dostępu.
                        </p>
                        <p style="margin:0;font-size:14px;color:#5b6b75">
                            Współpracę można nawiązać ponownie w każdej chwili.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
