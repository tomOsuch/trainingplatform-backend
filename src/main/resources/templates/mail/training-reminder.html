<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:24px;background:#f2f4f5;
             font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
             color:#16232b;line-height:1.6">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:520px;background:#ffffff;border:1px solid #cfd8dc;
                    border-radius:4px;padding:32px">
                <tr>
                    <td>
                        <h1 style="margin:0 0 16px;font-size:22px;font-weight:600">
                            Przypomnienie o treningu
                        </h1>
                        <p style="margin:0 0 16px">
                            Masz zaplanowany trening — <strong th:text="${when}">—</strong>.
                        </p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="background:#f7f9fa;border-radius:3px;padding:16px;margin:0 0 24px">
                            <tr>
                                <td>
                                    <p style="margin:0 0 4px;font-size:17px;font-weight:600"
                                       th:text="${title}">—</p>
                                    <p style="margin:0;font-size:14px;color:#5b6b75"
                                       th:text="${categoryName}">—</p>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0 0 16px;font-size:14px;color:#5b6b75">
                            Po treningu dodaj wpis w dzienniku — dzięki temu zaliczy się
                            do Twoich celów i statystyk.
                        </p>
                        <p style="margin:0;font-size:13px;color:#5b6b75">
                            Nie chcesz takich wiadomości? Wyłącz przypomnienia w ustawieniach profilu.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
