spring:
  application:
    name: trainingplatform-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/training_platform}
    username: ${SPRING_DATASOURCE_USERNAME:tp_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:Administrator}
    last-name: ${ADMIN_LAST_NAME:Systemu}
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:zaproszenia@trainingplatform.local}
  invitation:
    expiration-days: ${INVITATION_EXPIRATION_DAYS:7}
    accept-base-url: ${INVITATION_ACCEPT_BASE_URL:http://localhost:3000/register}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:60}
    reset-base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:14}
    cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:refreshToken}
    cookie-path: ${REFRESH_TOKEN_COOKIE_PATH:/api/auth}
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-ip: ${RATE_LIMIT_LOGIN_PER_IP:20}
    login-per-account: ${RATE_LIMIT_LOGIN_PER_ACCOUNT:8}
    login-window: ${RATE_LIMIT_LOGIN_WINDOW:15m}
    password-reset-per-email: ${RATE_LIMIT_RESET_PER_EMAIL:3}
    password-reset-per-ip: ${RATE_LIMIT_RESET_PER_IP:10}
    password-reset-window: ${RATE_LIMIT_RESET_WINDOW:60m}
    invitation-per-admin: ${RATE_LIMIT_INVITATION_PER_ADMIN:20}
    invitation-window: ${RATE_LIMIT_INVITATION_WINDOW:60m}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha