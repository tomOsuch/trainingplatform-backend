spring:
  application:
    name: trainingplatform-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/training_platform}
    username: ${SPRING_DATASOURCE_USERNAME:tp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tp_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-me-in-production-minimum-64-bytes-long-1234}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:Administrator}
    last-name: ${ADMIN_LAST_NAME:Systemu}
  mail:
    provider: ${MAIL_PROVIDER:log}
  invitation:
    expiration-days: ${INVITATION_EXPIRATION_DAYS:7}
    accept-base-url: ${INVITATION_ACCEPT_BASE_URL:http://localhost:5173/register}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha