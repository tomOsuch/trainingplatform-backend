spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

jwt:
  secret: test-secret-key-change-me-in-production-minimum-64-bytes-long-12345678
  expiration: 86400000

# Ten plik przesłania src/main/resources/application.yml w całości, więc blok
# app musi tu być powtórzony — klasy *Properties są @Validated i bez wartości
# kontekst testowy nie wstanie.
app:
  admin:
    email: ""
    password: ""
    first-name: Administrator
    last-name: Systemu
  mail:
    provider: log
    from: testy@trainingplatform.local
  invitation:
    expiration-days: 7
    accept-base-url: http://localhost:3000/register
  password-reset:
    expiration-minutes: 60
    reset-base-url: http://localhost:3000/reset-password
  refresh-token:
    expiration-days: 14
    cookie-name: refreshToken
    cookie-path: /api/auth
    cookie-secure: false
    cookie-same-site: Lax
  rate-limit:
    enabled: false
    login-per-ip: 20
    login-per-account: 8
    login-window: 15m
    password-reset-per-email: 3
    password-reset-per-ip: 10
    password-reset-window: 60m
    invitation-per-admin: 20
    invitation-window: 60m
